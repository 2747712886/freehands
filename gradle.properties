# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties (NeoForge 1.21.1)

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
# The NeoForge version (ModDevGradle pulls the matching NeoForm + Minecraft client/server)
neo_version=21.1.249
neo_version_range=[21.1,)
# The mod loader version range - NeoForge 1.21/1.21.1 is loader major 4
loader_version_range=[4,)


## Mod Properties

mod_id=freehands
mod_name=Free Hands
mod_license=All Rights Reserved
mod_version=0.2.0
mod_group_id=com.yourname.freehands
mod_authors=YourNameHere
mod_description=Free Hands adds two Curios slots that let equipped tools, weapons, armor, and trinkets provide their functions without occupying your hands.

