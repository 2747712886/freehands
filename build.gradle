plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Minecraft 1.21.1 ships Java 21 to end users, so the mod targets Java 21.
// The foojay-resolver plugin (settings.gradle) auto-provisions a JDK 21 toolchain.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    mavenCentral()
    // Curios (TheIllusiveC4)
    maven {
        name = 'TheIllusiveC4'
        url = 'https://maven.theillusivec4.top/'
    }
}

// GameTest 结构夹具：1.21.1 仍从运行目录读取 SNBT，运行前 staging 到 run/。
def copyGameTestStructures = tasks.register('copyGameTestStructures', Copy) {
    from('src/gametest/resources')
    into('run')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            // RunModel 没有 gameTestServer() 方法，用 type 字符串指定运行类型。
            type = "gameTestServer"
            gameDirectory = file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore(copyGameTestStructures)
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Curios (NeoForge) — provides the free_hand slot capability used by the core logic.
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

// FTB Ultimine 连锁兼容测试依赖（NeoForge 1.21.1）：仅当三 jar 齐备时加入运行时类路径，不进发布产物。
// 缺失时 FTBUltimineMixin（@Pseudo）自动跳过、12 个 Ultimine 测试优雅跳过（pressUltimineKey 返回 false）。
// jar 来源：ftb-ultimine/ftb-library 走 FTB maven(releases, 2101.1.x=MC1.21.1)，architectury 走 Modrinth CDN。
def ftbUltimineNeoForgeJars = [
        file('run/dev-mods/architectury-neoforge-13.0.11.jar'),
        file('run/dev-mods/ftb-library-neoforge-2101.1.35.jar'),
        file('run/dev-mods/ftb-ultimine-neoforge-2101.1.15.jar'),
]
if (ftbUltimineNeoForgeJars.every { it.isFile() }) {
    dependencies {
        runtimeOnly files(ftbUltimineNeoForgeJars)
    }
}

// run/dev-mods 不进版本库：换机器时 12 个连锁测试会静默跳过，用本任务按 sha1 校验重新拉取。
// 客户端专用 devmods（JEI / IMBlocker / JustEnoughCharacters）尚未移植到 1.21.1，仅手工验证时需要。
// 注意：architectury 同版本号在 Modrinth 与 maven.architectury.dev 上的包字节不同，此处一律按 maven 发布的 sha1 校验。
tasks.register('downloadDevelopmentMods') {
    group = 'freehands'
    description = '下载 FTB Ultimine 连锁兼容测试所需的 NeoForge 1.21.1 开发模组到 run/dev-mods。'
    def artifacts = [
            [url   : 'https://maven.ftb.dev/releases/dev/ftb/mods/ftb-ultimine-neoforge/2101.1.15/ftb-ultimine-neoforge-2101.1.15.jar',
             name  : 'ftb-ultimine-neoforge-2101.1.15.jar',
             sha1  : 'c96a7cc0b52bf919660ea61c1536cebd9d5773b3'],
            [url   : 'https://maven.ftb.dev/releases/dev/ftb/mods/ftb-library-neoforge/2101.1.35/ftb-library-neoforge-2101.1.35.jar',
             name  : 'ftb-library-neoforge-2101.1.35.jar',
             sha1  : '9922fa358983120edeed22194bf02bcf9c859fbb'],
            [url   : 'https://maven.architectury.dev/dev/architectury/architectury-neoforge/13.0.11/architectury-neoforge-13.0.11.jar',
             name  : 'architectury-neoforge-13.0.11.jar',
             sha1  : '46f0d2f3126ed240c0cb0d7616e5ea2f92eefd5f'],
    ]
    outputs.upToDateWhen { artifacts.every { file("run/dev-mods/${it.name}").isFile() } }
    doLast {
        artifacts.each { artifact ->
            def target = file("run/dev-mods/${artifact.name}")
            if (target.isFile()) {
                println "已存在，跳过 ${artifact.name}"
                return
            }
            target.parentFile.mkdirs()
            new URI(artifact.url).toURL().withInputStream { input ->
                target.withOutputStream { output -> output << input }
            }
            def digest = java.security.MessageDigest.getInstance('SHA-1')
                .digest(target.bytes).collect { String.format('%02x', it) }.join()
            if (digest != artifact.sha1) {
                target.delete()
                throw new GradleException("${artifact.name} sha1 校验失败：期望 ${artifact.sha1}，实际 ${digest}")
            }
            println "已下载 ${artifact.name}"
        }
    }
}

// Expand mod metadata placeholders into neoforge.mods.toml at processResources time.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
